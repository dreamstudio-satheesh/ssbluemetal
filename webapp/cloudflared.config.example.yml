# Named Cloudflare tunnel — copy to %USERPROFILE%\.cloudflared\config.yml on Windows
# (or ~/.cloudflared/config.yml on Linux/macOS) and replace the placeholders.
#
# 1. cloudflared tunnel login
# 2. cloudflared tunnel create ssm-api        -> prints UUID, writes <UUID>.json
# 3. cloudflared tunnel route dns ssm-api api.abc.com
# 4. cloudflared tunnel run ssm-api

tunnel: REPLACE-WITH-TUNNEL-UUID
credentials-file: C:\Users\REPLACE-USER\.cloudflared\REPLACE-WITH-TUNNEL-UUID.json

ingress:
  # Replace with the hostname routed in step 3.
  - hostname: api.abc.com
    service: http://127.0.0.1:8000
  - service: http_status:404
